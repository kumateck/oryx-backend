services:
  app:
    build:
      context: .
      dockerfile: deploy.Dockerfile
    restart: always
    image: oryx-api
    ports:
      - "8080:5001"
    environment:
      - connectionString=Host=postgres_db;Port=5432;Username=${DB_USERNAME};Password=${DB_PASSWORD};Database=${DB_DATABASE}
      - redisConnectionString=redis:6379,abortConnect=false
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - ONLYOFFICE_PUBLIC_URL=${ONLYOFFICE_PUBLIC_URL}
      - ONLYOFFICE_INTERNAL_URL=http://onlyoffice_documentserver
      - API_INTERNAL_BASE_URL=http://oryx_api:5001
      - AUTOMAPPER_LICENSE_KEY=${AUTOMAPPER_LICENSE_KEY:?Set the production AutoMapper license key}
    volumes:
      - ./https:/https:ro
    networks:
      - sail
    container_name: oryx_api

  onlyoffice_documentserver:
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver@sha256:3ab6ebc7c605e5a32b7ae3ff19daed4925090245acc8100ce2230bd766c88212}
    restart: always
    container_name: onlyoffice_documentserver
    ports:
      - "8082:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    networks:
      - sail

networks:
  sail:
    external: true
  shared:
    driver: bridge
