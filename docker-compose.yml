services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    image: oryx-api
    ports:
      - "8080:5001"
    environment:
      - connectionString=Host=postgres_db;Port=5432;Username=${DB_USERNAME};Password=${DB_PASSWORD};Database=${DB_DATABASE}
      - redisConnectionString=redis:6379,abortConnect=false
      - RUN_TEST_SEEDS=ON
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=${ACCESS_KEY}
      - MINIO_SECRET_KEY=${SECRET_KEY}
      - MINIO_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD}
      - MONGO_DB_CONNECTION_STRING=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./https:/https:ro
    networks:
      - sail
    container_name: oryx_api

networks:
  sail:
    external: true
  shared:
    driver: bridge
