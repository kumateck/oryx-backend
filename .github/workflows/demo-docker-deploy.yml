name: Build and Deploy Docker Image

on:
  push:
    branches:
      - demo

env:
  DOCKER_IMAGE_NAME: kumateck/oryx-erp-api-demo
  CONTAINER_NAME: oryx-erp-api-demo
  HOST_PORT: 8086
  CONTAINER_PORT: 5006

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          file: demo.Dockerfile
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:cache,mode=max
  migrate:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install dotnet-ef
        run: |
          dotnet tool install -g dotnet-ef --version 9.0.3
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore Oryx.sln

      - name: Generate idempotent migration script
        run: |
          dotnet ef migrations script --idempotent \
            --project INFRASTRUCTURE/INFRASTRUCTURE.csproj \
            --startup-project API/API.csproj \
            -o migration.sql

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: migration.sql
          retention-days: 14

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]

    steps:
      - name: Download migration script
        uses: actions/download-artifact@v4
        with:
          name: migration-script

      - name: Install SSH Client
        run: sudo apt-get install -y openssh-client

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy migration script to server
        run: |
          scp -o StrictHostKeyChecking=no -P "${{ secrets.SSH_PORT }}" migration.sql \
            "${{ secrets.SSH_USERNAME }}"@"${{ secrets.SSH_HOST }}":/tmp/migration_${{ github.run_id }}.sql

      - name: Apply database migration
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USERNAME }}"@"${{ secrets.SSH_HOST }}" -p "${{ secrets.SSH_PORT }}" << EOF
            set -e
            echo "Applying pending migrations to entrancedb"
            docker exec -i -e PGPASSWORD="${{ secrets.DB_PASSWORD }}" postgres_db \
              psql -U "${{ secrets.DB_USERNAME }}" -d entrancedb -v ON_ERROR_STOP=1 < /tmp/migration_${{ github.run_id }}.sql
            rm -f /tmp/migration_${{ github.run_id }}.sql
          EOF

      - name: Deploy to Server
        env:
          DOCKER_IMAGE_NAME: ${{ env.DOCKER_IMAGE_NAME }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USERNAME }}"@"${{ secrets.SSH_HOST }}" -p "${{ secrets.SSH_PORT }}" << EOF
            set -e
            echo "Logging in to Docker Hub"
            echo '${{ secrets.DOCKER_PASSWORD }}' | docker login --username '${{ secrets.DOCKER_USERNAME }}' --password-stdin

            echo "Ensuring 'sail' network exists"
            docker network inspect sail >/dev/null 2>&1 || docker network create sail

            echo "Waiting for the governed calculation service"
            formula_ready=false
            for attempt in \$(seq 1 24); do
              formula_status="\$(docker inspect --format='{{.State.Health.Status}}' formula-calculation 2>/dev/null || echo missing)"
              formula_secret_source="\$(docker inspect --format='{{range .Mounts}}{{if eq .Destination "/run/secrets"}}{{if eq .Type "volume"}}{{.Name}}{{else}}{{.Source}}{{end}}{{end}}{{end}}' formula-calculation 2>/dev/null || true)"
              if [ "\$formula_status" = healthy ] && docker exec formula-calculation /bin/sh -c 'test -s /run/secrets/formula-service-token' >/dev/null 2>&1; then
                formula_ready=true
                break
              fi
              if [ "\$attempt" -lt 24 ]; then
                sleep 5
              fi
            done
            if [ "\$formula_ready" != true ]; then
              echo "Governed calculation service was not healthy after 120 seconds."
              echo "Expected container: formula-calculation; observed status: \$formula_status"
              docker ps -a --filter name=^/formula-calculation\$ || true
              docker logs --tail 80 formula-calculation 2>/dev/null || true
              exit 1
            fi
            if [ -z "\$formula_secret_source" ]; then
              # Older formula containers mounted the token as a host file rather than
              # the shared directory. Keep that deployment format usable during rollout.
              if [ -s /opt/oryx/secrets/formula-service-token ]; then
                formula_secret_source=/opt/oryx/secrets/formula-service-token
              else
                echo "The healthy calculation service does not expose its formula-service token mount."
                exit 1
              fi
            fi

            echo "Pulling the immutable API image"
            docker pull "${DOCKER_IMAGE_NAME}:${{ github.sha }}"

            echo "Stopping and removing the existing container if it exists"
            if [ \$(docker ps -a | grep "${CONTAINER_NAME}" | wc -l) -gt 0 ]; then
              docker stop "${CONTAINER_NAME}"
              docker rm "${CONTAINER_NAME}"
            fi

            echo "Running the new Docker container"
            docker run -d --init --restart always --net sail -p "${HOST_PORT}:${CONTAINER_PORT}" --name "${CONTAINER_NAME}" \
            --env DB_USERNAME=${{ secrets.DB_USERNAME }} \
            --env DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --env ACCESS_KEY=${{ secrets.ACCESS_KEY }} \
            --env SECRET_KEY=${{ secrets.SECRET_KEY }} \
            --env DEFAULT_PASSWORD=${{ secrets.DEFAULT_PASSWORD }} \
            --env SMTP_USERNAME=${{ secrets.SMTP_USERNAME }} \
            --env SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }} \
            --env MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }} \
            --env MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }} \
            --env MONGO_DB_CONNECTION_STRING="mongodb://${{ secrets.MONGO_INITDB_ROOT_USERNAME }}:${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}@mongodb:27017" \
            --env MINIO_ACCESS_KEY=${{ secrets.ACCESS_KEY }} \
            --env MINIO_SECRET_KEY=${{ secrets.SECRET_KEY }} \
            --env connectionString="Host=postgres_db;Port=5432;Username=${{ secrets.DB_USERNAME }};Password=${{ secrets.DB_PASSWORD }};Database=entrancedb" \
            --env RABBITMQ_DEFAULT_USER=${{ secrets.RABBITMQ_DEFAULT_USER }} \
            --env RABBITMQ_DEFAULT_PASS=${{ secrets.RABBITMQ_DEFAULT_PASS }} \
            --env RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }} \
            --env SMTP_HOST=${{ secrets.SMTP_HOST }} \
            --env SMTP_PORT=${{ secrets.SMTP_PORT }} \
            --env SMTP_FROM=${{ secrets.SMTP_FROM }} \
            --env FORMULA_RUNTIME_ENABLED=true \
            --env FORMULA_SERVICE_BASE_URL=http://formula-calculation:3101/ \
            --env FORMULA_SERVICE_AUTH_SECRET_FILE=/run/secrets/formula-service-token \
            --env FORMULA_SERVICE_CLIENT_TIMEOUT_MS=2500 \
            --volume "\$formula_secret_source:/run/secrets:ro" \
            "${DOCKER_IMAGE_NAME}:${{ github.sha }}"

            sleep 5
            test "\$(docker inspect --format='{{.State.Running}}' "${CONTAINER_NAME}")" = true
          EOF
